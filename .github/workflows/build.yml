name: Build and check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '30.0.16248370'
  CMAKE_VERSION: '4.1.2'

defaults:
  run:
    shell: bash

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NDK tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z -- '*.c' '*.cpp' '*.h' '*.hpp' |
            xargs -0 -r clang-format --dry-run --Werror

  android:
    name: Android / ${{ matrix.abi }} / ${{ matrix.stl }}
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
        stl: [c++_static, c++_shared]
    env:
      ABI: ${{ matrix.abi }}
      STL: ${{ matrix.stl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build and install static and shared libraries
        run: |
          for type in STATIC SHARED; do
            cmake -S . -B "build-$type" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-23 \
              -DANDROID_STL="$STL" \
              -DCMAKE_BUILD_TYPE=Release \
              -DYUKIPLT_LIBRARY_TYPE="$type" \
              -DYUKIPLT_LTO=ON \
              -DYUKIPLT_RELEASE_OPTIMIZATION=Oz
            cmake --build "build-$type" --parallel 2
            cmake --install "build-$type" --prefix "$PWD/package/$type" --component production
          done
          test -s package/STATIC/lib/libyukiplt.a
          test -s package/SHARED/lib/libyukiplt.so

      - name: Run clang-tidy
        run: |
          clang-tidy --version
          git ls-files -z -- 'src/*.cpp' |
            xargs -0 -r -n 1 -P 2 clang-tidy -p build-SHARED

      - name: Record build information and checksums
        run: |
          {
            printf 'commit=%s\nabi=%s\nstl=%s\napi=23\nlto=full\noptimization=Oz\n' \
              "$GITHUB_SHA" "$ABI" "$STL"
            cat "$NDK_ROOT/source.properties"
            clang++ --version
            cmake --version
          } > package/build-info.txt
          cd package
          find . -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/yukiplt-SHA256SUMS"
          mv "$RUNNER_TEMP/yukiplt-SHA256SUMS" SHA256SUMS

      - name: Upload libraries and development files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yukiplt-${{ matrix.abi }}-${{ matrix.stl }}
          path: package/
          if-no-files-found: error
          retention-days: 14
